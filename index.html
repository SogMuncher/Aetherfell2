<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetherfell 2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
      body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #e8dcc0; }
      #game { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      #ui .panel { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="game"><canvas id="screen"></canvas></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
